[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfform"
version = "0.1.0"
description = "Derive a JSON Schema from a PDF form and fill it from the command line or as a library"
authors = [
    { name = "Florian R. Hölzlwimmer", email = "hoeze-minion@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["pdf", "acroform", "forms", "json-schema", "xfa"]
dependencies = [
    "pypdf>=5.1",
    "click>=8.1",
    "jsonschema>=4.21",
]

[project.scripts]
pdfform = "pdfform.cli:main_cli"

[dependency-groups]
dev = [
    "tox>=4",
    "tox-uv",
]
test = [
    "pytest>=8,<9",
    "pytest-xdist",
    "pytest-mock",
    "pytest-cov",
    "pytest-sugar",
]
lint = [
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfform"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["scripts", "resources", "testdir"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SIM", "PLR", "F811", "F841"]
"__init__.py" = ["F401"]

[tool.tox]
requires = ["tox>=4", "tox-uv"]
env_list = ["format-check", "lints", "typecheck", "py3.12", "py3.14"]
isolated_build = true

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run unit tests"
dependency_groups = ["test"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.env."format-check"]
runner = "uv-venv-lock-runner"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "format", "--check", "."]]

[tool.tox.env."lints"]
runner = "uv-venv-lock-runner"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "."]]

[tool.tox.env."typecheck"]
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [["mypy", "src/pdfform"]]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
